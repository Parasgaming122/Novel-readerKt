name: Build and Release APK (Modular)

on:
  workflow_dispatch:
    inputs:
      version:
        description: 'Release version (e.g. 1.3). Leave empty to auto-increment from last tag.'
        required: false
        type: string

jobs:
  build:
    name: Build & Release Android APK
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          ref: modular
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          if [ -n "${{ inputs.version }}" ]; then
            # Manual version provided
            VERSION="${{ inputs.version }}"
            # Strip leading 'v' if user typed 'v1.3'
            VERSION="${VERSION#v}"
          else
            # Auto-increment: find latest tag matching vx.y pattern
            LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
            if [ -z "$LATEST_TAG" ]; then
              VERSION="1.0"
            else
              LATEST_TAG="${LATEST_TAG#v}"
              MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1)
              MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
              PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
              # Increment patch (1.2 -> 1.3)
              if [ -z "$PATCH" ] || [ "$PATCH" = "$MINOR" ]; then
                # No patch field: 1.2 -> 1.3
                MINOR=$((MINOR + 1))
                VERSION="${MAJOR}.${MINOR}"
              else
                # Has patch field: 1.2.3 -> 1.2.4
                PATCH=$((PATCH + 1))
                VERSION="${MAJOR}.${MINOR}.${PATCH}"
              fi
            fi
          fi

          # Calculate version code from version string (e.g. 1.3 -> 103, 1.12 -> 112)
          MAJOR=$(echo "$VERSION" | cut -d. -f1)
          MINOR=$(echo "$VERSION" | cut -d. -f2)
          PATCH=$(echo "$VERSION" | cut -d. -f3)
          if [ -z "$PATCH" ] || [ "$PATCH" = "$MINOR" ]; then
            VERSION_CODE=$((MAJOR * 100 + MINOR))
          else
            VERSION_CODE=$((MAJOR * 1000 + MINOR * 10 + PATCH))
          fi

          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "version_code=${VERSION_CODE}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "release_name=Release (Modular) v${VERSION}" >> $GITHUB_OUTPUT
          echo "APK_NAME=NovelReaderV3-v${VERSION}.apk" >> $GITHUB_OUTPUT
          echo "Resolved version: ${VERSION} (code ${VERSION_CODE})"

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Patch Version in build.gradle.kts
        run: |
          sed -i "s/versionCode = .*/versionCode = ${{ steps.version.outputs.version_code }}/" app/build.gradle.kts
          sed -i "s/versionName = .*/versionName = \"${{ steps.version.outputs.version }}\"/" app/build.gradle.kts
          echo "--- Updated build.gradle.kts version block ---"
          grep -A1 'versionCode' app/build.gradle.kts | head -2

      - name: Generate Release Keystore (Fallback)
        run: |
          if [ ! -f my-upload-key.jks ]; then
            keytool -genkey -v -keystore my-upload-key.jks -storepass "${{ secrets.STORE_PASSWORD || 'android' }}" -alias upload -keypass "${{ secrets.KEY_PASSWORD || 'android' }}" -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Release,O=Android,C=US"
          fi

      - name: Build Release APK
        run: ./gradlew assembleRelease --no-daemon
        env:
          STORE_PASSWORD: ${{ secrets.STORE_PASSWORD || 'android' }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD || 'android' }}
          KEYSTORE_PATH: my-upload-key.jks

      - name: Locate and Rename APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/release -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: Release APK file not found!"
            exit 1
          fi
          # Rename to include version
          RENAMED_PATH="app/build/outputs/apk/release/${{ steps.version.outputs.APK_NAME }}"
          cp "$APK_PATH" "$RENAMED_PATH"
          echo "apk_path=${RENAMED_PATH}" >> $GITHUB_OUTPUT
          echo "APK packaged as: ${{ steps.version.outputs.APK_NAME }}"

      - name: Create Git Tag
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.version.outputs.tag }}"
          git push origin "${{ steps.version.outputs.tag }}"

      - name: Create Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: ${{ steps.version.outputs.release_name }}
          files: ${{ steps.apk.outputs.apk_path }}
          body: "Automated release build **v${{ steps.version.outputs.version }}** from the modular branch."
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}