name: Build Debug APK (Modular)

on:
  push:
    branches:
      - modular

jobs:
  build:
    name: Build & Upload Android Debug APK
    runs-on: ubuntu-latest

    permissions:
      contents: write
      packages: read

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Determine Version
        id: version
        run: |
          LATEST_TAG=$(git tag --list 'v*' --sort=-v:refname | head -1)
          if [ -z "$LATEST_TAG" ]; then
            VERSION="1.0"
          else
            LATEST_TAG="${LATEST_TAG#v}"
            MAJOR=$(echo "$LATEST_TAG" | cut -d. -f1)
            MINOR=$(echo "$LATEST_TAG" | cut -d. -f2)
            PATCH=$(echo "$LATEST_TAG" | cut -d. -f3)
            if [ -z "$PATCH" ] || [ "$PATCH" = "$MINOR" ]; then
              MINOR=$((MINOR + 1))
              VERSION="${MAJOR}.${MINOR}"
            else
              PATCH=$((PATCH + 1))
              VERSION="${MAJOR}.${MINOR}.${PATCH}"
            fi
          fi
          VERSION="${VERSION}-debug"
          echo "version=${VERSION}" >> $GITHUB_OUTPUT
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "APK_NAME=NovelReaderV3-${VERSION}.apk" >> $GITHUB_OUTPUT

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: "17"
          distribution: "temurin"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "9.3.1"
          validate-wrappers: false

      - name: Generate Debug Keystore
        run: |
          keytool -genkey -v -keystore debug.keystore -storepass android -alias androiddebugkey -keypass android -keyalg RSA -keysize 2048 -validity 10000 -dname "CN=Android Debug,O=Android,C=US"

      - name: Build Debug APK
        run: ./gradlew assembleDebug --no-daemon

      - name: Locate and Rename APK
        id: apk
        run: |
          APK_PATH=$(find app/build/outputs/apk/debug -name "*.apk" -type f | head -1)
          if [ -z "$APK_PATH" ]; then
            echo "Error: APK file not found!"
            exit 1
          fi
          RENAMED_PATH="app/build/outputs/apk/debug/${{ steps.version.outputs.APK_NAME }}"
          cp "$APK_PATH" "$RENAMED_PATH"
          echo "apk_path=${RENAMED_PATH}" >> $GITHUB_OUTPUT

      - name: Create Debug Release and Upload APK
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.version.outputs.tag }}
          name: "Debug Build (Modular) ${{ steps.version.outputs.version }}"
          files: ${{ steps.apk.outputs.apk_path }}
          body: "Automated debug build **v${{ steps.version.outputs.version }}** from push to modular branch."
          draft: false
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}